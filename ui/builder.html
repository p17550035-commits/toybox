<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/ui/navigation.css">
    <link rel="stylesheet" href="/ui/builder.css">
</head>
<body>

<div id="nav"></div>

<h1>Module Builder</h1>
<p>Create or delete modules using the UI.</p>

<div class="builder-container">

    <h2>Create Module</h2>

    <label>Module Name</label>
    <input id="name" type="text">

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Category</label>
    <input id="category" type="text">

    <label>Page Type</label>
    <select id="page_type">
        <option value="fluent">Fluent</option>
        <option value="dynamic">Dynamic</option>
    </select>

    <label>run.py Code</label>
    <textarea id="code"></textarea>

    <label>install.sh Script</label>
    <textarea id="install_script"></textarea>

    <label>uninstall.sh Script</label>
    <textarea id="uninstall_script"></textarea>

    <label>config.json Data</label>
    <textarea id="config_data">{}</textarea>

    <button onclick="createModule()">Create Module</button>

    <hr>

    <h2>Delete Module</h2>

    <label>Module Name</label>
    <input id="delete_name" type="text">

    <button onclick="deleteModule()">Delete Module</button>

</div>

<script src="/ui/builder.js"></script>

</body>
</html>
